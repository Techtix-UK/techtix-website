<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Techtix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Google Material Design Style Inputs */
        input, select, textarea {
            width: 100%;
            padding: 16px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: var(--space-md);
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
            transition: all var(--transition-fast);
            outline: none;
        }
        
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: inset 0 0 0 1px var(--primary);
        }
        
        /* Validation States */
        input:not(:placeholder-shown):invalid,
        textarea:not(:placeholder-shown):invalid,
        select:invalid:not(:focus) {
            border-color: #d93025; /* Google error red */
        }
        input:not(:placeholder-shown):valid,
        textarea:not(:placeholder-shown):valid {
            border-color: #188038; /* Google success green */
        }
        
        label {
            display: block; 
            font-size: 0.875rem; 
            font-weight: 500; 
            margin-bottom: 8px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <strong style="font-size: 1.5rem; letter-spacing: -1px; color: var(--text-main);">TECHTIX<span style="color: var(--primary);">.</span></strong>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="divisions.html">Divisions</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html" class="btn-nav">Let's Talk</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section class="hero" style="padding-bottom: var(--space-md);">
            <div class="container hero-content">
                <h1>Let's Connect</h1>
                <p>Drop us a message below and our team will get back to you shortly.</p>
            </div>
        </section>

        <section class="section-padding" style="padding-top: 0;">
            <div class="container" style="max-width: 800px;">
                <div class="bento-card">
                    <form action="https://formspree.io/f/mbdzkbpp" method="POST">
                        <div style="display: flex; gap: var(--space-md); flex-wrap: wrap;">
                            <div style="flex: 1; min-width: 250px;">
                                <label>Full Name</label>
                                <input type="text" name="Full Name" placeholder=" " required>
                            </div>
                            <div style="flex: 1; min-width: 250px;">
                                <label>Email Address</label>
                                <input type="email" name="Email Address" placeholder=" " required>
                            </div>
                        </div>
                        
                        <label>Service Requested</label>
                        <select name="Service Requested" required>
                            <option value="" disabled selected>Select a core service...</option>
                            <option value="Tech">Tech Support</option>
                            <option value="Marketing">Marketing Agency</option>
                            <option value="Web">Web Design</option>
                            <option value="Airbnb">Remote Airbnb Management</option>
                            <option value="Multiple">Multiple Services</option>
                        </select>
                        
                        <label>Message</label>
                        <textarea name="Message" rows="5" placeholder="Tell us about your project..." required></textarea>
                        
                        <button type="submit" class="btn-primary" style="width: 100%; margin-top: var(--space-sm); cursor: pointer;">Request Your Strategy Session</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>
        let lastScrollY = window.scrollY;
        const header = document.getElementById('main-header');
        window.addEventListener('scroll', () => {
            if (lastScrollY < window.scrollY && window.scrollY > 100) {
                header.style.transform = 'translateY(-100%)';
            } else {
                header.style.transform = 'translateY(0)';
            }
            lastScrollY = window.scrollY;
        });
    </script>
</body>
</html>
